  const endings={seal:'Você decide devolver o fragmento ao selo. Borin aquece o metal sem quebrá-lo, enquanto Lyra canta a melodia que sua mãe lhe ensinou. A névoa recua. O sino toca uma única vez — não como aviso, mas como promessa. O ciclo não foi destruído para sempre, porém Vardelume ganhou tempo e uma chance de escolher seu futuro.',power:'Você decide usar a pedra negra para alimentar o sino. A luz atravessa os sete marcos e os monstros fogem para as sombras. Por um instante, Vardelume parece invencível. Então uma voz antiga responde debaixo do gelo: “Finalmente, alguém abriu a porta.” O reino prospera sob uma luz impossível, mas algo do outro lado agora conhece seu nome.'};
  G.panel(which==='seal'?'🌅 Final: O Selo Renovado':'🌑 Final: A Porta Desperta',`<div style="line-height:1.8;color:#f0e5ca;padding:10px"><h3 style="color:#e8c77b;font-family:Georgia,serif">${which==='seal'?'Uma esperança conquistada':'Um poder com preço'}</h3><p>${endings[which]}</p><p><b>Seu desfecho foi salvo no perfil.</b> Você pode continuar explorando; a escolha ficará registrada.</p><button onclick="G.lore()">Voltar às crônicas</button></div>`)
 },
 lore(){
  const entries=[
   {id:'town',t:'I · Antes do primeiro sino',s:'A fundação de Vardelume',where:'Encontrado desde o início',b:'Muito antes das estradas, os vales eram guiados pelas estrelas e por um rio que nascia sob as montanhas. Os primeiros habitantes ergueram sete marcos de pedra: não fronteiras, mas promessas de que nenhum poder pertenceria a uma única mão. O sino foi fundido com metal das profundezas. Sua língua de prata desapareceu na noite em que as estrelas se apagaram por alguns instantes. Os anciãos chamaram aquilo de mau presságio; os arquivos do conselho chamaram de “primeiro contato”.'},
   {id:'caves',t:'II · A Noite das Cinzas',s:'O pacto quebrado',where:'Descoberta ao entrar nas Cavernas Sombrias',b:'Há um século, uma expedição procurou minério para reparar o sino e voltou com uma pedra negra que pulsava como um coração. O conselho ordenou que fosse selada, mas um conselheiro tentou usá-la para alimentar a forja. As chamas ficaram azuis e uma névoa cobriu as estradas. A verdade mais incômoda está numa nota rasgada: a expedição não encontrou a pedra — ela parecia estar esperando por eles.'},
   {id:'forest',t:'III · A Floresta Sussurrante',s:'Memórias entre as raízes',where:'Descoberta ao explorar a Floresta Sussurrante',b:'As árvores guardam lembranças dos que desapareceram na Noite das Cinzas. Os fogos-fátuos repetem nomes de pessoas que nunca nasceram. Ao seguir uma luz até uma árvore rachada, você ouve a voz de uma mulher dizendo “não o deixem tocar o sino”. A voz é antiga, mas Lyra reconheceria aquela cadência: era a canção que sua mãe cantava antes de desaparecer.'},
   {id:'borin',t:'IV · Borin, o ferreiro',s:'Ferro, culpa e esperança',where:'Descoberta ao conversar com Borin',b:'O avô de Borin participou da expedição às cavernas. Ele voltou com um fragmento do selo e escondeu-o sob a forja. Borin não contou isso por medo de que a vila o culpasse pelo desastre. O fragmento esquenta nas noites sem lua e, quando encostado ao ferro comum, forma por um instante o desenho de uma porta. Borin acredita que consertar a oficina não é só preparar armas: é terminar o trabalho que sua família abandonou.'},
   {id:'lyra',t:'V · Lyra e as pequenas luzes',s:'A lembrança que pede para voltar',where:'Descoberta ao ajudar Lyra',b:'Lyra estudou essências para encontrar pistas sobre a mãe, desaparecida na floresta. As essências espectrais não contêm almas inteiras, mas memórias quebradas. Em uma delas, Lyra ouviu a palavra “devolva” e viu sete sombras ao redor de um sino enterrado. Ela teme que a mãe não tenha sido morta: talvez tenha ficado do outro lado, mantendo a porta fechada.'},
   {id:'swamp',t:'VI · A palavra devolvida',s:'O pântano lembra',where:'Descoberta ao entrar no Pântano Nevoento',b:'No pântano, a névoa forma palavras quando toca o minério. “Devolva” não é uma ameaça: é uma exigência. A pedra negra foi arrancada de um mecanismo que mantinha algo adormecido. Cada criatura alterada pelo sino está fugindo do chamado, não obedecendo a ele. As lendas foram escritas por vencedores que confundiram o medo dos monstros com maldade.'},
   {id:'ice',t:'VII · A porta sob o gelo',s:'O outro lado do juramento',where:'Descoberta ao alcançar o Cume Gelado',b:'Sob o gelo existe uma porta mais antiga que Vardelume. Os sete marcos são as fechaduras; o sino, a chave; a pedra negra, um fragmento do mecanismo. A expedição abriu uma fresta e alguém — talvez a mãe de Lyra — ficou para fechá-la. O reino não está sendo atacado por um exército. Está sendo chamado por aquilo que um dia prometeu nunca despertar.'}
  ];
  G._lore=entries;
  const found=P.story&&Array.isArray(P.story.found)?P.story.found:['town'];
  const cards=entries.map((e,i)=>{const ok=found.includes(e.id);return `<div class="row" style="display:block;margin:7px 0;opacity:${ok?1:.72}"><button ${ok?'':'disabled'} style="width:100%;text-align:left;white-space:normal;height:auto;min-height:48px;${ok?'':'opacity:.55'}" onclick="G.loreEntry(${i})">${ok?'📖':'🔒'} ${ok?e.t:'Fragmento desconhecido'}<br><small>${ok?e.s:e.where}</small></button></div>`}).join('');
  const stage=G.storyStage(),stageNames=['O primeiro sinal','Pistas despertas','A verdade fragmentada','O juramento final','Consequências do juramento'];
  const journal=(P.story&&P.story.journal||[]).slice(-6).reverse();
  const journalHtml=`<div class="row" style="display:block;margin-top:10px"><b>🧭 Estado da campanha</b><p><b>${stageNames[stage]}</b></p><small>${stage===0?'Converse com os moradores e aceite sua primeira missão.':stage===1?'As primeiras tarefas abriram caminho para os segredos do reino.':stage===2?'Compare as pistas das regiões e escute os dois guardiões dos segredos.':stage===3?'As missões e pistas estão reunidas. Você pode decidir o destino do selo.':'Seu desfecho foi registrado; as pessoas agora vivem com as consequências.'}</small><hr><b>Diário de descobertas</b>${journal.length?'<ul style="padding-left:20px">'+journal.map(j=>'<li>'+j.text+'</li>').join('')+'</ul>':'<p><small>Suas descobertas aparecerão aqui.</small></p>'}</div>`;
  const ending=P.story&&P.story.ending?`<div class="row" style="display:block;border-color:#d9b86c"><b>Desfecho registrado</b><br>${P.story.ending==='seal'?'O Selo Renovado':'A Porta Desperta'}<br><button onclick="G.storyChoice('${P.story.ending}')">Reler seu final</button></div>`:'';
  const choices=G.storyCanEnd()&&!P.story.ending?`<div class="row" style="display:block;margin-top:12px"><b>⚖️ O juramento final</b><p>Você reuniu as pistas. O que deve ser feito com a pedra negra?</p><button style="white-space:normal;height:auto;padding:10px" onclick="G.storyChoice('seal')">🔒 Renovar o selo e proteger o reino</button> <button style="white-space:normal;height:auto;padding:10px" onclick="G.storyChoice('power')">🌑 Usar o poder e abrir a porta</button></div>`:'';
  G.panel('📚 Crônicas de Vardelume',`<div style="padding:8px 2px;color:#e9d9b5;line-height:1.55"><p><i>As crônicas não são mais um livro completo: são fragmentos que você precisa descobrir no mundo.</i></p><div class="pb"><i style="width:${found.length/entries.length*100}%"></i></div><small>${found.length} de ${entries.length} fragmentos encontrados</small>${cards}<div class="row" style="display:block;margin-top:10px"><b>🧭 Rumores e lembranças</b><p>Converse com Borin e Lyra, explore cada região e conclua as missões para revelar o destino do reino.</p></div>${journalHtml}${ending}${choices}</div>`)
 },
 loreEntry(i){const e=G._lore&&G._lore[i];if(!e)return;const found=P.story&&P.story.found||[];if(!found.includes(e.id))return toast('Este fragmento ainda não foi descoberto no mundo.');
  let extra='';if(e.id==='borin')extra='<p><i>Escolha de diálogo:</i> pergunte a Borin sobre o fragmento para registrar sua confiança.</p><button onclick="G.storyTalk(\'borin\')">Perguntar sobre o fragmento</button>';
  if(e.id==='lyra')extra='<p><i>Escolha de diálogo:</i> ofereça ajuda a Lyra para investigar a lembrança.</p><button onclick="G.storyTalk(\'lyra\')">Prometer ajudar Lyra</button>';
  G.panel('📖 '+e.t,`<div style="max-width:620px;margin:auto;line-height:1.75;color:#f0e5ca;padding:8px 3px"><small style="color:#d9b86c">${e.where}</small><h3 style="color:#e8c77b;font-family:Georgia,serif">${e.s}</h3><p>${e.b}</p>${extra}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button onclick="G.lore()">← Voltar às descobertas</button><button onclick="G.close()">Fechar livro</button></div></div>`)
 },
 storyTalk(who){if(!P.story.choices)P.story.choices={};P.story.choices[who]=1;G.storyEvent('trust_'+who,who==='borin'?'Você ouviu a verdade de Borin e aceitou carregar parte do segredo da família.':'Você prometeu ajudar Lyra a procurar uma saída que não condene o reino.');save();const msg=who==='borin'?'Borin baixa a voz: “Se a pedra voltar ao selo, talvez minha família finalmente possa descansar. Mas não posso escolher por todos.”':'Lyra segura uma essência contra a luz: “Se minha mãe ainda estiver do outro lado, não quero que a salvem destruindo o reino. Prometa que vai procurar outra saída.”';G.dlg(msg,[['Guardar estas palavras',()=>{$("dlg").hidden=true;toast('🧭 Memória registrada no diário');G.lore()}],['Voltar',()=>{$("dlg").hidden=true}]])},
 panel(t,h){$('pt').textContent=t;$('pb').innerHTML=h;$('panel').hidden=false},
 refresh(){if(!$('panel').hidden&&$('pt').textContent==='Mochila')G.inv()},
 spell,
 dlg(txt,btns){const d=$('dlg');d.hidden=false;d.innerHTML=`<div>${txt}</div>`;btns.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;d.appendChild(b)})},
 shop(n,stock){const buy=stock.map(id=>{const i=IT[id];return`<div class="row"><span>${G.iname(id)}<br><small>${i.atk?'Atq '+i.atk+' ':''}${i.def?'Def '+i.def+' ':''}${i.arm?'Arm '+i.arm+' ':''}${i.req>1?'Nv '+i.req:''}${i.th?'2 mãos ':''}${i.am?'Munição +'+i.am+' ':''}${PK(i)>1?'pacote x'+PK(i)+' ':''}${i.mp?' Mana +'+i.mp:''}${i.d?' Dano '+i.d[0]+'-'+i.d[1]:''}${i.v?' · '+i.v.map(x=>VOC[x]).join('/'):''}</small></span><button onclick="G.buy('${id}',${JSON.stringify(stock).replace(/"/g,"'")},'${n}')">${i.price*PK(i)}g</button></div>`}).join('');
  const sell=Object.entries(P.inv).map(([id,c])=>`<div class="row"><span>${G.iname(id)} x${c}</span><button onclick="G.sell('${id}',${JSON.stringify(stock).replace(/"/g,"'")},'${n}')">+${Math.max(1,IT[id].price>>1)}g</button></div>`).join('');
  G.panel(n+' — Ouro: '+P.gold,`<b>Comprar</b>${buy}<br><b>Vender</b>${sell||'<div>Nada para vender.</div>'}`)},
 buy(id,st,n){if(P.gold<IT[id].price)return toast('Ouro insuficiente');P.gold-=IT[id].price;give(id);G.shop(n,st);save()},
 sell(id,st,n){P.gold+=Math.max(1,IT[id].price>>1);take(id);G.shop(n,st);save()},
 talk(n){const stk=n===npcB?STOCK1.concat(P.q.smith.s===2?STOCK2:[]):['hp','mp','hp2','torch'],close=['Fechar',()=>$('dlg').hidden=true],shop=['Loja',()=>{$('dlg').hidden=true;G.shop(n.n,stk)}],q=P.q;
  if(P.story&&P.story.ending&&(n===npcB||n===npcL)){const sealed=P.story.ending==='seal',msg=n===npcB?(sealed?'Borin: O fragmento esfriou. Pela primeira vez em gerações, consigo dormir sem ouvir o sino. A oficina agora protege a vila — e não a porta.':'Borin: A pedra responde ao seu poder. Forjei armas mais fortes, mas às vezes ouço algo batendo do outro lado do gelo. Espero que o preço não seja maior do que imaginamos.'):(sealed?'Lyra: A névoa está recuando. Ainda não sei onde minha mãe está, mas a essência parou de sussurrar “devolva”. Obrigada por escolher proteger quem ainda está aqui.':'Lyra: As luzes estão mais brilhantes desde que o sino despertou. Uma delas pronunciou meu nome. Se minha mãe estiver do outro lado, talvez agora eu possa ouvi-la — mas tenho medo do que também nos ouviu.');G.dlg(msg,[shop,close]);return}
  if(n===npcL){G.discoverStory('lyra');const r=q.rats;if(r.s===0)G.dlg('Lyra: Ratos infestam os campos a leste! Derrote 5 deles e eu lhe pago.',[['Aceitar',()=>{r.s=1;toast('Missão aceita');G.talk(n)}],shop,close]);
   else if(r.s===1&&r.k>=5)G.dlg('Lyra: Maravilha! Aqui está sua recompensa. Há algo mais que preciso lhe contar sobre as luzes.',[['Receber',()=>{r.s=2;P.gold+=60;give('hp',3);G.storyEvent('quest_rats_done','Missão concluída: Lyra já confia em você e compartilhou a lembrança das luzes.');toast('+60 ouro, 3 Poções de Vida');save();G.discoverStory('lyra');G.dlg('Lyra: Minha mãe desapareceu seguindo essas luzes. Uma essência repetiu a palavra “devolva”. Se descobrir o que foi roubado, talvez eu encontre o caminho até ela.',[["Registrar a lembrança",()=>{G.storyTalk('lyra')}],["Fechar",()=>$('dlg').hidden=true]])}]]);
   else G.dlg(r.s===1?`Lyra: Ainda faltam ratos (${r.k}/5).`:'Lyra: Poções e compras! O que deseja?',[["Perguntar sobre as luzes",()=>{G.discoverStory('lyra');G.storyTalk('lyra')}],shop,close])}
  else{G.discoverStory('borin');const s=q.smith,ore=P.inv.ore||0;let b=[["Perguntar sobre a pedra negra",()=>{G.discoverStory('borin');G.storyTalk('borin')}],shop,close],t='Borin: Armas e armaduras para iniciantes, forjadas aqui!';
   if(s.s===0&&P.lv>=10){t='Borin: Nível 10! Preciso de ajuda para melhorar minha forja: 8 Minérios de Ferro (goblins os carregam) e 150 de ouro.';b.unshift(['Aceitar missão',()=>{s.s=1;toast('Missão aceita');G.talk(n)}])}
   else if(s.s===0)t+=' Volte no nível 10: terei uma tarefa para você.';
   else if(s.s===1){t=`Borin: Minério ${ore}/8, ouro ${P.gold}/150.`;if(ore>=8&&P.gold>=150)b.unshift(['Entregar',()=>{take('ore',8);P.gold-=150;s.s=2;G.storyEvent('quest_smith_done','Missão concluída: a oficina de Borin foi restaurada e o fragmento pode ser estudado.');toast('Oficina melhorada! Novos itens à venda.');save();G.talk(n)}])}
   else t='Borin: Minha oficina melhorou graças a você! Veja os novos itens ou use a Forja para reforçar seu equipamento com materiais dos monstros.';G.dlg(t,b)}}};
